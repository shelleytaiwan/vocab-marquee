<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>詞語複習</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#EFE9DF; --card:#F8F4EC; --ink:#2B1D1A; --muted:#8C7B70; --line:#D6CCBD; --hl:#9A3F22;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Hiragino Sans",sans-serif;
}
.wrap{flex:1;width:100%;max-width:none;margin:0 auto;padding:0 2.5vw;display:flex;flex-direction:column;min-height:0}
.top{position:relative;padding:14px 0 12px;min-height:56px}
.home{position:absolute;left:0;top:50%;transform:translateY(-50%);color:var(--ink);text-decoration:none;font-size:15px;font-weight:500;border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:2px;transition:transform .15s,box-shadow .15s,border-color .15s}
.home:hover{border-color:var(--ink);transform:translate(-2px,-2px);box-shadow:2px 2px 0 var(--ink)}
.screen{display:none;flex:1;flex-direction:column;gap:14px;min-height:0}
.screen.on{display:flex}
button{font-family:inherit;cursor:pointer;border-radius:2px;transition:transform .15s,box-shadow .15s,border-color .15s}
button:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:2px 2px 0 var(--ink)}
button:focus-visible,.home:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
button:disabled{opacity:.35;cursor:default}
.btn{font-weight:700;font-size:clamp(17px,2.1vw,24px);padding:16px 28px;border:1px solid var(--ink);letter-spacing:.06em}
.btn-solid{background:var(--ink);color:var(--card)}
.btn-ghost{background:var(--card);color:var(--ink)}
/* 選單 */
.menu{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;padding:20px 0 40px;text-align:center}
.menu h2{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(40px,8vw,110px);letter-spacing:.1em;line-height:1.25}
.menu p{margin-top:14px;font-size:clamp(16px,2vw,22px);color:var(--muted);letter-spacing:.08em}
.mode-row{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;width:100%}
.mcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;flex:1;max-width:420px;padding:clamp(28px,6vh,60px) 20px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.mcard.solid{background:var(--ink);color:var(--card);border-color:var(--ink)}
.mcard:hover{border-color:var(--ink)}
.mcard .big{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(40px,7vw,84px);letter-spacing:.12em;line-height:1.1}
.mcard b{font-size:clamp(18px,2.4vw,28px);font-weight:700;letter-spacing:.08em}
.mcard small{font-size:clamp(14px,1.8vw,20px);letter-spacing:.08em;opacity:.7}
.mode-row .btn{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(32px,6vw,72px);padding:clamp(28px,6vh,64px) 56px;min-width:min(340px,40vw);letter-spacing:.2em}
/* 遊戲 */
.bar{display:flex;align-items:center;gap:14px}
.bar .mode{font-weight:700;font-size:clamp(18px,2.2vw,26px);letter-spacing:.08em;white-space:nowrap}
.prog{flex:1;height:4px;background:var(--line);min-width:40px}
.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
.cnt{font-size:clamp(15px,1.8vw,22px);color:var(--muted);white-space:nowrap;letter-spacing:.06em}
.back-sm{font-size:15px;font-weight:500;padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.back-sm:hover:not(:disabled){border-color:var(--ink)}
.stage{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:2px;flex:1;min-height:200px}
.tag{position:absolute;top:14px;left:16px;font-size:clamp(14px,1.6vw,20px);font-weight:700;letter-spacing:.1em;color:var(--hl);border:1px solid var(--hl);padding:3px 10px;border-radius:2px;z-index:2}
#mq{position:absolute;top:50%;left:0;white-space:nowrap;font-weight:900;will-change:transform;visibility:hidden;pointer-events:none}
#mq.py{font-family:"Noto Sans TC",sans-serif;font-size:clamp(64px,26vh,300px);letter-spacing:.06em;color:var(--hl)}
#mq.wd{font-family:"KaiTi","DFKai-SB","BiauKai","Noto Serif TC",serif;font-size:clamp(80px,34vh,380px);letter-spacing:.1em;color:var(--ink)}
.ctrl{display:flex;gap:14px;justify-content:center}
.ctrl .btn{flex:1;max-width:none;font-size:clamp(20px,3vw,32px);padding:clamp(14px,2.4vh,24px) 28px}
/* 完成 */
.done{flex:1;align-items:center;justify-content:center;text-align:center;gap:18px;padding:20px 0 40px}
.done h2{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(34px,6vw,60px);letter-spacing:.1em}
.done p{font-size:clamp(17px,2vw,22px);color:var(--muted)}
.done .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:14px}
footer{text-align:center;padding:8px 24px 12px;font-size:12px;letter-spacing:.06em;color:var(--muted)}
@media (max-width:640px){
  .wrap{padding:0 2.5vw}
  .top{padding:10px 0 10px}
  .home{position:static;transform:none;display:inline-block;margin-bottom:10px;font-size:14px}
  .home:hover{transform:none;box-shadow:none}
  .mode-row{flex-direction:column;align-items:stretch}
  .mcard{max-width:none}
  .bar{flex-wrap:wrap}
  .prog{order:5;flex-basis:100%}
  .ctrl{flex-direction:column}
  .ctrl .btn{max-width:none}
}
@media (prefers-reduced-motion:reduce){button,.home,.prog i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="home" href="https://shelleytaiwan.github.io/review-for-NP/">← 返回主頁</a>
  </header>

  <section class="screen on" id="s-menu">
    <div class="menu">
      <div>
        <h2>詞語複習</h2>
        <p id="m-sub"></p>
      </div>
      <div class="mode-row">
        <button class="mcard solid" onclick="start('pinyin')"><span class="big">拼音</span><b>跑馬燈拼音</b><small>看拼音，念出詞語</small></button>
        <button class="mcard" onclick="start('word')"><span class="big">詞語</span><b>跑馬燈詞語</b><small>看詞語，念出來</small></button>
      </div>
    </div>
  </section>

  <section class="screen" id="s-game">
    <div class="bar">
      <button class="back-sm" onclick="goMenu()">回選單</button>
      <div class="mode" id="g-mode">拼音</div>
      <div class="cnt" id="g-cnt"></div>
      <div class="prog"><i id="g-fill"></i></div>
    </div>
    <div class="stage" id="stage">
      <div class="tag" id="g-tag">D1</div>
      <div id="mq"></div>
    </div>
    <div class="ctrl">
      <button class="btn btn-ghost" onclick="speakCur()">朗讀</button>
      <button class="btn btn-solid" id="g-next" onclick="doNext()" disabled>下一個</button>
    </div>
  </section>

  <section class="screen done" id="s-done">
    <h2>完成了！</h2>
    <p id="d-sub"></p>
    <div class="row">
      <button class="btn btn-solid" onclick="restart()">再練一次</button>
      <button class="btn btn-ghost" onclick="goMenu()">回選單</button>
    </div>
  </section>
</div>
<footer>Shelleytaiwan 製作 · 2027 · 請勿商用</footer>

function stopAnim(){ if(anim){ cancelAnimationFrame(anim); anim=null; } }
function goMenu(){ stopAnim(); window.speechSynthesis && speechSynthesis.cancel(); show('s-menu'); }
function start(m){
  mode = m;
  try{ const v = localStorage.getItem('vmq_'+m); idx = v!=null ? Math.max(0,Math.min(+v,CARDS.length-1)) : 0; }catch(e){ idx=0; }
  $('g-mode').textContent = m==='pinyin' ? '拼音' : '詞語';
  show('s-game'); launch();
}
function restart(){ idx=0; show('s-game'); launch(); }

function launch(){
  if(idx >= CARDS.length){ show('s-done'); return; }
  const c = CARDS[idx], el = $('mq'), btn = $('g-next'), stage = $('stage');
  $('g-tag').textContent = 'D' + c.lesson;
  $('g-cnt').textContent = (idx+1) + ' / ' + CARDS.length;
  $('g-fill').style.width = ((idx+1)/CARDS.length*100) + '%';
  el.className = mode==='pinyin' ? 'py' : 'wd';
  el.textContent = mode==='pinyin' ? c.pinyin : c.word;
  el.style.visibility = 'hidden';
  btn.disabled = true; canNext = false;
  stopAnim();
  setTimeout(() => {
    const sw = stage.clientWidth, ew = el.offsetWidth || 500;
    const sx = sw + 20, ex = -(ew + 60), t0 = performance.now();
    el.style.transform = 'translateY(-50%) translateX(' + sx + 'px)';
    el.style.visibility = 'visible';
    (function tick(now){
      const t = Math.min((now - t0) / SPEED, 1);
      el.style.transform = 'translateY(-50%) translateX(' + (sx + (ex - sx) * t) + 'px)';
      if(t < 1){ anim = requestAnimationFrame(tick); }
      else { el.style.visibility='hidden'; anim=null; canNext=true; btn.disabled=false; }
    })(performance.now());
  }, 80);
  try{ localStorage.setItem('vmq_'+mode, idx); }catch(e){}
}
function doNext(){
  if(!canNext) return;
  if(idx >= CARDS.length-1){ show('s-done'); return; }
  idx++; launch();
}
function speakCur(){
  if(idx >= CARDS.length || !('speechSynthesis' in window)) return;
  let w = CARDS[idx].word.replace(/面/g,'麵').replace(/還書/g,'環書').replace(/出身地/g,'出身帝').replace(/出生地/g,'出生帝').replace(/連假/g,'連價').replace(/為什麼/g,'喂什麼');
  const u = new SpeechSynthesisUtterance(w);
  u.lang='zh-TW'; u.rate=0.82;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x=>x.lang==='zh-TW'&&/Taiwan|Meijia|Tingting|Yating/i.test(x.name)) || vs.find(x=>x.lang==='zh-TW') || vs.find(x=>x.lang.startsWith('zh'));
  if(v) u.voice = v;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
document.addEventListener('keydown', e => {
  if(!$('s-game').classList.contains('on')) return;
  if((e.key==='ArrowDown'||e.key===' '||e.key==='ArrowRight') && canNext){ e.preventDefault(); doNext(); }
  if(e.key==='Enter') speakCur();
});
</script>
</body>
</html>
